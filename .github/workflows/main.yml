name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y libssl-dev libffi-dev libsqlite3-dev build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk zip unzip
      - name: Build APK
        run: |
          buildozer init
          sed -i 's/# (str) Title of your application/title = NetBoost/g' buildozer.spec
          sed -i 's/# (str) Package name of your application/package.name = netboost/g' buildozer.spec
          sed -i 's/# (str) Package domain (needed for android/package.domain = com.netboost/g' buildozer.spec
          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: NetBoost-APK
          path: bin/*.apk
